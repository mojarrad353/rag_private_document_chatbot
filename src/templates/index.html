<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="container">
    <div class="header"><h3>Private Document Chatbot</h3></div>

    <div class="upload-area">
        <input type="file" id="pdf-file" accept=".pdf" multiple>
        <button class="upload-btn" id="upload-btn">Upload PDFs</button>
    </div>
    <div class="status" id="status-msg"></div>

    <div class="chat-box" id="chat-box">
        <div class="message bot-message">Please upload one or more PDF documents to start chatting.</div>
    </div>

    <div class="input-area">
        <input type="text" id="user-input" placeholder="Type your question..." disabled>
        <button class="send-btn" id="send-btn" disabled>Send</button>
    </div>
</div>

<script src="/static/app.js"></script>

</body>
</html>
