services:
  app:
    image: ${APP_IMAGE:-}
    build: .
    command: sh -c "uv sync && gunicorn --bind 0.0.0.0:5000 --reload --timeout 120 src.app:app"
    # No ports: exposed — only reachable via Nginx on the internal network
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-5-mini}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_API_KEY=${LANGSMITH_API_KEY:-${LANGCHAIN_API_KEY:-}}
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_PROJECT=rag-private-document-chatbot
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
    depends_on:
      - redis
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    # No ports: exposed — only reachable internally by Grafana
    depends_on:
      - app
    networks:
      - internal

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "127.0.0.1:3001:3000"  # Localhost only — changed to 3001 to avoid conflicts
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
      - loki
    networks:
      - internal

  redis:
    image: redis:alpine
    container_name: redis
    # No ports: exposed — only reachable internally by app and worker
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - internal

  worker:
    image: ${APP_IMAGE:-}
    build: .
    container_name: worker
    command: sh -c "uv sync && celery -A src.celery_app.celery_app worker --loglevel=info"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-5-mini}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-true}
      - LANGCHAIN_API_KEY=${LANGSMITH_API_KEY:-${LANGCHAIN_API_KEY:-}}
      - LANGCHAIN_ENDPOINT=https://api.smith.langchain.com
      - LANGCHAIN_PROJECT=rag-private-document-chatbot
    volumes:
      - ./src:/app/src
      - ./uploads:/app/uploads
      - ./chroma_db:/app/chroma_db
      - ./pyproject.toml:/app/pyproject.toml
      - ./uv.lock:/app/uv.lock
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: pyproject.toml
    depends_on:
      - redis
      - app
    networks:
      - internal
    healthcheck:
      test: [ "CMD-SHELL", "celery -A src.celery_app.celery_app inspect ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"  # ONLY public entry point
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - internal

  loki:
    image: grafana/loki:3.4.2
    container_name: loki
    # No ports: exposed — only reachable internally by Grafana and Promtail
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--output-document=-", "http://localhost:3100/ready" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - internal

  socket-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: socket-proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1        # Allow listing containers (needed for discovery)
      - POST=0              # Block all write operations
      - ALLOW_START=0
      - ALLOW_STOP=0
      - NETWORKS=0          # Block network inspection
      - SERVICES=0
      - INFO=0              # Block engine info (hides host details)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - internal

  promtail:
    image: grafana/promtail:3.4.2
    container_name: promtail
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      # No docker.sock — uses socket-proxy instead
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
      - socket-proxy
    networks:
      - internal

networks:
  internal:
    driver: bridge

volumes:
  loki-data:
