events {
    worker_connections 1024;
}

http {
    # --- Per-endpoint rate limit zones ---
    # General UI/static requests: generous limit
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    # Chat endpoint: each call triggers an LLM request ($$$)
    limit_req_zone $binary_remote_addr zone=chat:10m rate=2r/s;
    # Upload endpoint: disk + compute intensive
    limit_req_zone $binary_remote_addr zone=upload:10m rate=1r/s;
    # Task status polling
    limit_req_zone $binary_remote_addr zone=status:10m rate=5r/s;

    # Return JSON instead of default HTML for rate-limit errors
    limit_req_status 429;

    server {
        listen 80;
        server_name localhost;

        # Shared proxy headers (used by all proxy locations)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # --- Chat endpoint: strict rate limit (expensive LLM calls) ---
        location /chat {
            limit_req zone=chat burst=5 nodelay;
            proxy_pass http://app:5000;
        }

        # --- Upload endpoint: strict rate limit (disk + compute) ---
        location /upload {
            limit_req zone=upload burst=3 nodelay;
            client_max_body_size 5M;
            proxy_pass http://app:5000;
        }

        # --- Task status polling ---
        location /status/ {
            limit_req zone=status burst=10 nodelay;
            proxy_pass http://app:5000;
        }

        # --- Metrics: internal networks only ---
        location /metrics {
            allow 172.16.0.0/12;   # Docker bridge networks
            allow 10.0.0.0/8;      # Docker overlay networks
            allow 127.0.0.1;       # Localhost
            deny all;
            proxy_pass http://app:5000/metrics;
        }

        # --- Health check: internal networks only ---
        location /health {
            allow 172.16.0.0/12;
            allow 10.0.0.0/8;
            allow 127.0.0.1;
            deny all;
            proxy_pass http://app:5000/health;
        }

        # --- Everything else (UI, static assets): generous limit ---
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://app:5000;
        }
    }
}
